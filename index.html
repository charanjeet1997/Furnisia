<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Charanjeet Singh Jaswani" />
    <meta name="description" content="Furnisia — Immersive 3D & VR Spatial Room Planner by Charanjeet Singh Jaswani" />
    <title>Furnisia™ — 3D & VR Room Planner by Charanjeet Singh Jaswani</title>
    <script>
      // Applied before React mounts / CSS paints, so there's no flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('furnisia-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
