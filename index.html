<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Charanjeet Singh Jaswani" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="google1439bf14edb63dc4" />

    <!-- Primary meta tags -->
    <title>Furnisia — Design Your Space in 3D, AR & VR</title>
    <meta name="description" content="Visualise, plan, and arrange 3D furniture in custom rooms built to your exact dimensions — in 3D and full-scale WebXR virtual reality." />
    <meta name="keywords" content="3D room planner, AR furniture visualizer, WebXR room designer, furniture visualization SaaS" />
    <link rel="canonical" href="https://furnisia.singhgamedev.in/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Furnisia" />
    <meta property="og:title" content="Furnisia — Design Your Space in 3D, AR & VR" />
    <meta property="og:description" content="Visualise, plan, and arrange 3D furniture in custom rooms built to your exact dimensions — in 3D and full-scale WebXR virtual reality." />
    <meta property="og:url" content="https://furnisia.singhgamedev.in/" />
    <meta property="og:image" content="https://furnisia.singhgamedev.in/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Furnisia — Design Your Space in 3D, AR & VR" />
    <meta name="twitter:description" content="Visualise, plan, and arrange 3D furniture in custom rooms built to your exact dimensions — in 3D and full-scale WebXR virtual reality." />
    <meta name="twitter:image" content="https://furnisia.singhgamedev.in/logo.png" />

    <!-- Global JSON-LD: Organization + SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Furnisia",
          "url": "https://furnisia.singhgamedev.in/",
          "logo": "https://furnisia.singhgamedev.in/logo.png",
          "founder": {
            "@type": "Person",
            "name": "Charanjeet Singh Jaswani",
            "url": "https://singhgamedev.in"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "Furnisia",
          "applicationCategory": "DesignApplication",
          "operatingSystem": "Web",
          "url": "https://furnisia.singhgamedev.in/",
          "description": "3D/AR/VR room planner and furniture visualizer for furniture retailers and shoppers.",
          "featureList": [
            "Quick start 3D canvas",
            "Custom parametric room builder",
            "Smart 3D furniture snapping",
            "Room presets",
            "WebXR VR walkthrough",
            "Cloud save"
          ]
        }
      ]
    }
    </script>

    <script>
      // Applied before React mounts / CSS paints, so there's no flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('furnisia-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
